name: check
on:
  push:
  pull_request:
  schedule:
  - cron: 45 4 * * 3
jobs:
  check:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        ruby:
        - '1.9'
        - '2.7'
        - '3.0'
        - '3.1'
        - '3.2'
        - '3.3'
        - '3.4'
        - '4.0'
        - jruby-9.4
        - jruby-10.0
        include:
        - ruby: ruby-head
          allow-failure: allow-failure
        - ruby: jruby-head
          allow-failure: allow-failure
      fail-fast: false
    continue-on-error: ${{ matrix.allow-failure && true || false }}
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ruby/setup-ruby@0dafeac902942906541bc140009cdbf32665b601 # v1.315.0
      with:
        ruby-version: "${{ matrix.ruby }}"
        bundler-cache: true
    - run: bundle exec rspec --format documentation
